name: CI

# Pipeline de integração contínua. Roda a cada push e pull request.
# Barra o merge se typecheck, lint, testes ou build falharem, ou se houver segredo exposto.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Testes
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  security:
    name: Varredura de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auditoria de dependências (frontend)
        run: cd frontend && npm audit --audit-level=high || true

      - name: Auditoria de dependências (backend)
        run: cd backend && npm audit --audit-level=high || true

      - name: Varredura de segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
